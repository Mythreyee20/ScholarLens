services:
  api:
    build: .
    container_name: scholarlens-api
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: pgvector/pgvector:pg16
    container_name: scholarlens-db
    environment:
      POSTGRES_DB: scholarlens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: scholarlens_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: